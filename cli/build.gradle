plugins {
    id 'application'
    id 'io.spring.dependency-management' version '1.1.4'
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:3.2.5'
    }
}

dependencies {
    implementation project(':replay-engine')
    implementation project(':recorder')
    implementation 'info.picocli:picocli:4.7.6'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.6'
}

application {
    mainClass = 'com.chronos.cli.ChronosCli'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(24)
    }
}

tasks.withType(JavaCompile) {
    options.release = 21
}

jar {
    dependsOn ':replay-engine:jar'
    manifest {
        attributes(
            'Main-Class': 'com.chronos.cli.ChronosCli'
        )
    }
    // Create a fat jar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

task runCli(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.chronos.cli.ChronosCli'
    workingDir = rootProject.projectDir
    if (project.hasProperty('cliArgs')) {
        args(project.property('cliArgs').split(' '))
    }
}
